name: public-contract-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r 代码/requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python examples/synthetic_risk_budget.py
      - run: python tools/check_public_release.py
